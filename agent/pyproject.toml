[project]
name = "companion-agent"
version = "0.1.3"
description = "LLM brain for the Sapienheim Valheim companion"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion_agent"]
